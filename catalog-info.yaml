apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: tf-molecule-s3-bucket-policy-attachment-aws
  description: Terraform molecule that attaches a JSON policy document to an existing S3 bucket, decoupled from bucket creation to break bucket -> CDN -> policy dependency cycles.
  annotations:
    github.com/project-slug: PlatformStackPulse/tf-molecule-s3-bucket-policy-attachment-aws
    backstage.io/techdocs-ref: dir:.
  tags:
    - terraform
    - aws
    - infrastructure
    - s3
    - iam
  links:
    - url: https://github.com/PlatformStackPulse/tf-molecule-s3-bucket-policy-attachment-aws
      title: GitHub Repository
      icon: github
spec:
  type: terraform-module
  lifecycle: production
  owner: platform-team
  system: infrastructure
  dependsOn:
    - resource: terraform-module:PlatformStackPulse/tf-label
    - resource: terraform-module:PlatformStackPulse/tf-atom-s3-bucket-policy-aws
